name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The schema is the source of truth for 200 options and two languages, so
      # a broken invariant there is worth catching before a tag does.
      - run: cargo test --locked

      - run: cargo build --locked
